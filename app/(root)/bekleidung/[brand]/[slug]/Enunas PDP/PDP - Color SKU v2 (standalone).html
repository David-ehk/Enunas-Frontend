  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'League Spartan';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"76057b76-bff7-4aeb-9a48-236521e64a65\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'League Spartan';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"6644af01-df61-4e9d-95a7-d7b00fc680b5\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n\n<style>\n  *, *::before, *::after { box-sizing: border-box; }\n  :root {\n    --enunas-black: #0A0A0A;\n    --enunas-gray-dark: #2D2D2D;\n    --enunas-gray-medium: #6B6B6B;\n    --enunas-gray-light: #E8E8E8;\n    --enunas-off-white: #F5F5F0;\n    --enunas-white: #FFFFFF;\n    --enunas-purple: #370E4D;\n    --enunas-purple-light: #4A1566;\n    --culture: #EA9575;\n    --experimental: #6C169C;\n  }\n  html, body { margin: 0; padding: 0; background: var(--enunas-white); }\n  body {\n    font-family: 'League Spartan', sans-serif;\n    color: var(--enunas-black);\n    -webkit-font-smoothing: antialiased;\n    -moz-osx-font-smoothing: grayscale;\n  }\n  h1, h2, h3 { font-family: 'Cormorant Garamond', serif; font-weight: 300; margin: 0; }\n  button { cursor: pointer; font-family: inherit; }\n  a { color: inherit; }\n\n  /* Navbar */\n  .nav {\n    display: flex; align-items: center; justify-content: space-between;\n    padding: 22px 40px;\n    border-bottom: 1px solid var(--enunas-gray-light);\n    background: var(--enunas-white);\n  }\n  .nav-left, .nav-right { display: flex; gap: 28px; width: 25%; }\n  .nav-right { justify-content: flex-end; align-items: center; }\n  .nav-icon {\n    background: transparent; border: none; padding: 4px;\n    display: flex; align-items: center; color: var(--enunas-black);\n    position: relative;\n  }\n  .logo {\n    font-family: 'Cormorant Garamond', serif;\n    font-size: 36px; letter-spacing: 0.04em; line-height: 1;\n  }\n  .cart-badge {\n    position: absolute; top: -6px; right: -8px;\n    background: var(--enunas-purple); color: #fff;\n    font-size: 10px; width: 16px; height: 16px; border-radius: 50%;\n    display: flex; align-items: center; justify-content: center;\n    font-family: 'League Spartan', sans-serif;\n  }\n\n  /* Breadcrumb */\n  .crumbs {\n    padding: 22px 32px 28px;\n    display: flex; gap: 12px;\n    align-items: center; flex-wrap: wrap;\n    font-family: 'League Spartan', sans-serif;\n    font-size: 13px; letter-spacing: 0.02em;\n    color: var(--enunas-gray-medium);\n  }\n  .crumbs a { color: var(--enunas-gray-medium); text-decoration: none; transition: color 200ms; }\n  .crumbs a:hover { color: var(--enunas-black); }\n  .crumbs .sep { color: var(--enunas-gray-light); }\n  .crumbs .here { color: var(--enunas-black); font-weight: 500; }\n\n  /* Main grid */\n  main { max-width: 1800px; margin: 0 auto; }\n  .pdp {\n    display: grid; grid-template-columns: 1fr 1fr; gap: 0;\n  }\n\n  /* Gallery */\n  .gallery {\n    background: var(--enunas-off-white);\n    padding: 32px;\n    display: flex; align-items: flex-start; justify-content: center;\n    min-height: 760px;\n  }\n  .product-tile {\n    width: 100%; max-width: 640px;\n    aspect-ratio: 3/4; background: #E8E5DC;\n    position: relative; overflow: hidden;\n    display: flex; align-items: center; justify-content: center;\n  }\n  .tile-shape {\n    width: 76%; height: 86%;\n    position: relative;\n    background: var(--shape-color, #DEDCD5);\n    clip-path: polygon(\n      24% 0%, 76% 0%, 78% 4%, 92% 14%, 100% 22%,\n      94% 30%, 90% 28%, 90% 100%, 10% 100%, 10% 28%,\n      6% 30%, 0% 22%, 8% 14%, 22% 4%\n    );\n  }\n  .placeholder-tag {\n    position: absolute; top: 16px; left: 16px;\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;\n    color: var(--enunas-gray-medium);\n    background: rgba(255,255,255,0.85); padding: 4px 8px;\n  }\n  .placeholder-empty {\n    position: absolute; bottom: 16px; right: 16px;\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;\n    color: var(--enunas-gray-medium);\n  }\n  .thumbs {\n    position: absolute; left: 12px; top: 50%;\n    transform: translateY(-50%);\n    display: flex; flex-direction: column; gap: 8px;\n  }\n  .thumb { width: 8px; height: 8px; background: rgba(10,10,10,0.25); }\n  .thumb.active { background: var(--enunas-black); }\n\n  /* Details column */\n  .details {\n    padding: 56px 72px 80px;\n    text-align: center;\n    display: flex; flex-direction: column; align-items: center;\n  }\n  .brand-row {\n    display: flex; align-items: center; gap: 14px;\n    margin-bottom: 14px;\n  }\n  .brand {\n    font-family: 'League Spartan', sans-serif;\n    font-size: 12px; letter-spacing: 0.3em; text-transform: uppercase;\n    color: var(--enunas-purple); font-weight: 500;\n    margin: 0;\n    /* link styling */\n    display: inline-flex; align-items: center; gap: 10px;\n    text-decoration: none;\n    padding: 8px 2px 9px;\n    border-bottom: 1px solid var(--enunas-purple);\n    cursor: pointer;\n    transition: color 220ms cubic-bezier(0.19,1,0.22,1),\n                border-color 220ms cubic-bezier(0.19,1,0.22,1);\n  }\n  .brand:hover {\n    color: var(--enunas-purple-light);\n    border-bottom-color: var(--enunas-purple-light);\n  }\n  .brand-arrow {\n    width: 11px; height: 11px;\n    transition: transform 240ms cubic-bezier(0.19,1,0.22,1);\n  }   <!-- Accordions -->\n      <div class=\"accordions\" id=\"accordions\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fmain>\n\n<!-- Recommendation rows -->\n<section class=\"recs\">\n  <div class=\"rec-row\" id=\"recLook\">\n    <div class=\"row-head\">\n      <h2 class=\"row-title\">Vervollständige den Look<\u002Fh2>\n      <a href=\"#\" class=\"row-link\" data-rec-link=\"\">Alle ansehen →<\u002Fa>\n    <\u002Fdiv>\n    <div class=\"row-grid\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"rec-row\" id=\"recBrand\">\n    <div class=\"row-head\">\n      <h2 class=\"row-title\">Mehr von <em id=\"recBrandName\">StreetLabel2<\u002Fem><\u002Fh2>\n      <a href=\"#\" class=\"row-link\" data-rec-link=\"\">Alle ansehen →<\u002Fa>\n    <\u002Fdiv>\n    <div class=\"row-grid\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"rec-row\" id=\"recSimilar\">\n    <div class=\"row-head\">\n      <h2 class=\"row-title\">Ähnliche Produkte<\u002Fh2>\n      <a href=\"#\" class=\"row-link\" data-rec-link=\"\">Alle ansehen →<\u002Fa>\n    <\u002Fdiv>\n    <div class=\"row-grid\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- Footer -->\n<footer class=\"cf\">\n  <div class=\"cf-grid\">\n    <div>\n      <p class=\"cf-eyebrow\">Lieferung &amp; Rückgabe<\u002Fp>\n      <p class=\"cf-serif\"><span id=\"returnText\">14 Tage Rückgaberecht<\u002Fspan>. Versand aus <span id=\"originText\">DE<\u002Fspan>.<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <p class=\"cf-eyebrow\">Kundenservice<\u002Fp>\n      <p class=\"cf-serif\">Mo–Sa, 9:30 – 19:00 Uhr<br>\n        <a href=\"mailto:kundenservice@enunas.com\" style=\"font-style:italic;color:#fff;border-bottom:1px solid rgba(255,255,255,0.4);text-decoration:none;padding-bottom:2px;\">kundenservice@enunas.com<\u002Fa>\n      <\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <p class=\"cf-eyebrow\">Zahlungsarten<\u002Fp>\n      <div class=\"pay-row\">\n        <span class=\"pay-tile\"><svg viewBox=\"0 0 48 32\" width=\"48\" height=\"32\"><text x=\"24\" y=\"22\" text-anchor=\"middle\" font-family=\"'League Spartan',sans-serif\" font-size=\"13\" font-weight=\"800\" font-style=\"italic\" fill=\"#1A1F71\" letter-spacing=\"1.2\">VISA<\u002Ftext><\u002Fsvg><\u002Fspan>\n        <span class=\"pay-tile\"><svg viewBox=\"0 0 48 32\" width=\"48\" height=\"32\"><circle cx=\"20\" cy=\"16\" r=\"8\" fill=\"#EB001B\"><\u002Fcircle><circle cx=\"28\" cy=\"16\" r=\"8\" fill=\"#F79E1B\"><\u002Fcircle><path d=\"M24 9.6a8 8 0 0 1 0 12.8 8 8 0 0 1 0-12.8Z\" fill=\"#FF5F00\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <span class=\"pay-tile\"><svg viewBox=\"0 0 48 32\" width=\"48\" height=\"32\"><text x=\"24\" y=\"21\" text-anchor=\"middle\" font-family=\"'League Spartan',sans-serif\" font-size=\"10\" font-weight=\"700\" font-style=\"italic\"><tspan fill=\"#003087\">Pay<\u002Ftspan><tspan fill=\"#0070BA\">Pal<\u002Ftspan><\u002Ftext><\u002Fsvg><\u002Fspan>\n        <span class=\"pay-tile\"><svg viewBox=\"0 0 48 32\" width=\"48\" height=\"32\"><text x=\"24\" y=\"21\" text-anchor=\"middle\" font-family=\"'League Spartan',sans-serif\" font-size=\"11\" font-weight=\"700\" fill=\"#0A0A0A\" letter-spacing=\"-0.3\">Klarna.<\u002Ftext><\u002Fsvg><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script>\n  /* ============================================================\n     Tweaks — persisted defaults (host can rewrite this JSON).\n     Wrap in EDITMODE markers so the host's __edit_mode_set_keys\n     messages update the file in place.\n  ============================================================ */\n  const TWEAKS = /*EDITMODE-BEGIN*/{\n    \"accent\": \"purple\",\n    \"cta\": \"accent\",\n    \"tags\": \"serif\",\n    \"stock\": \"dot\",\n    \"lookCount\": 4,\n    \"showGender\": true,\n    \"showInspiration\": true,\n    \"showChangeOutline\": true\n  }/*EDITMODE-END*/;\n\n  function applyTweaks(t) {\n    document.body.dataset.accent = t.accent;\n    document.body.dataset.cta    = t.cta;\n    document.body.dataset.tags   = t.tags;\n    document.body.dataset.stock  = t.stock;\n    document.body.dataset.gender      = t.showGender      ? 'on' : 'off';\n    document.body.dataset.inspiration = t.showInspiration ? 'on' : 'off';\n    document.body.classList.toggle('show-notes', !!t.showChangeOutline);\n    // Re-render the look section when the count changes\n    if (typeof renderRecs === 'function') renderRecs();\n    // Mirror to the toolbar toggle so its label stays in sync\n    const tn = document.getElementById('toggleNotes');\n    if (tn) {\n      tn.classList.toggle('active', !!t.showChangeOutline);\n      tn.textContent = t.showChangeOutline ? 'Hide change' : 'Show change';\n    }\n  }\n\n  function setTweak(patch) {\n    Object.assign(TWEAKS, patch);\n    applyTweaks(TWEAKS);\n    // Persist via host\n    try {\n      window.parent.postMessage({ type: '__edit_mode_set_keys', edits: patch }, '*');\n    } catch (_) {}\n  }\n\n  /* Wire segmented controls */\n  function wireSegmented(rootId, key, parse) {\n    const root = document.getElementById(rootId);\n    if (!root) return;\n    root.addEventListener('click', (e) => {\n      const btn = e.target.closest('button');\n      if (!btn) return;\n      root.querySelectorAll('button').forEach(b => b.classList.remove('active'));\n      btn.classList.add('active');\n      const v = parse ? parse(btn.dataset.value) : btn.dataset.value;\n      setTweak({ [key]: v });\n    });\n  }\n  wireSegmented('tweakAccent',    'accent');\n  wireSegmented('tweakCta',       'cta');\n  wireSegmented('tweakTags',      'tags');\n  wireSegmented('tweakStock',     'stock');\n  wireSegmented('tweakLookCount', 'lookCount', (v) => parseInt(v, 10));\n\n  /* Wire toggle switches */\n  document.querySelectorAll('.tweak-toggle').forEach((tog) => {\n    tog.addEventListener('click', () => {\n      const key = tog.dataset.key;\n      const next = !tog.classList.contains('on');\n      tog.classList.toggle('on', next);\n      setTweak({ [key]: next });\n    });\n  });\n\n  /* Sync initial UI state from defaults */\n  function syncTweakUiFromDefaults() {\n    const segs = { accent: 'tweakAccent', cta: 'tweakCta', tags: 'tweakTags', stock: 'tweakStock', lookCount: 'tweakLookCount' };\n    Object.entries(segs).forEach(([key, id]) => {\n      const root = document.getElementById(id);\n      if (!root) return;\n      root.querySelectorAll('button').forEach(b =>\n        b.classList.toggle('active', b.dataset.value == TWEAKS[key]));\n    });\n    document.querySelectorAll('.tweak-toggle').forEach(tog => {\n      tog.classList.toggle('on', !!TWEAKS[tog.dataset.key]);\n    });\n  }\n\n  /* Panel show/hide + host protocol */\n  const tweaksPanel = document.getElementById('tweaksPanel');\n  const tweaksClose = document.getElementById('tweaksClose');\n\n  function openTweaks() { tweaksPanel.classList.add('open'); tweaksPanel.setAttribute('aria-hidden','false'); }\n  function closeTweaks() {\n    tweaksPanel.classList.remove('open');\n    tweaksPanel.setAttribute('aria-hidden','true');\n    try { window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); } catch (_) {}\n  }\n  tweaksClose.addEventListener('click', closeTweaks);\n\n  /* Listen FIRST, then announce — host's activate can land before listener exists otherwise */\n  window.addEventListener('message', (e) => {\n    const d = e.data || {};\n    if (d.type === '__activate_edit_mode')   openTweaks();\n    if (d.type === '__deactivate_edit_mode') closeTweaks();\n  });\n  try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch (_) {}\n\n  /* Brand link — prevent jump in mockup, optional visual confirmation */\n  document.querySelectorAll('[data-brand-link], #sizeGuide, #fitAdvisor, [data-rec-link]').forEach((a) => {\n    a.addEventListener('click', (e) => {\n      e.preventDefault();\n    });\n  });\n\n  /* Apply tweaks on boot */\n  syncTweakUiFromDefaults();\n  applyTweaks(TWEAKS);\n\n  /* Toolbar \"Tweaks\" toggle */\n  document.getElementById('toggleTweaks').addEventListener('click', () => {\n    if (tweaksPanel.classList.contains('open')) closeTweaks();\n    else openTweaks();\n  });\n<\u002Fscript>\n\n<script>\n  /* ============================================================\n     Backend-shaped product data — exact response shape.\n     Two examples to show null vs filled fields.\n  ============================================================ */\n  const PRODUCT_DROP = {\n    brandId: 3,\n    brandName: \"StreetLabel2\",\n    careInstructions: \"Cold wash only\",\n    catalogueCategory: null,\n    category: \"CLOTHING\",\n    collectionName: \"Winter 2025\",\n    createdAt: \"2026-05-13T21:28:40.63069154\",\n    creatorEmail: \"brand2@test.com\",\n    creatorId: 5,\n    description: \"Premium cotton hoodie\",\n    gender: \"UNISEX\",\n    id: 1,\n    images: [],\n    inspirationStory: \"Inspired by Berlin nights\",\n    material: \"100% organic cotton\",\n    name: \"Drop Hoodie Vol.1\",\n    originCountry: \"DE\",\n    price: 8500, /* cents */\n    releaseDate: \"2025-11-01\",\n    returnPeriodDays: 14,\n    status: \"ACTIVE\",\n    updatedAt: \"2026-05-13T21:28:40.630706111\",\n    variants: [\n      { color: \"Black\", id: 1, size: \"M\", sku: \"YJPD7U2K\", stockQuantity: 50, weightGrams: 400 },\n      { color: \"Black\", id: 2, size: \"L\", sku: \"TY63FERX\", stockQuantity: 30, weightGrams: 420 }\n    ],\n    videos: []\n  };\n\n  const PRODUCT_VIVIENNE = {\n    brandId: 7,\n    brandName: \"Vivienne Westwood\",\n    careInstructions: \"Dry clean only\",\n    catalogueCategory: [\"Experimental\", \"Culture\", \"Star\"],\n    category: \"CLOTHING\",\n    collectionName: \"Worlds End AW25\",\n    createdAt: \"2026-04-02T10:15:00\",\n    creatorEmail: \"vw@test.com\",\n    creatorId: 11,\n    description: \"Iconisches Denim Boxer Jacket — zeitloses Design mit modernem Twist.\",\n    gender: \"WOMEN\",\n    id: 42,\n    images: [],\n    inspirationStory: \"An ode to the 1981 collection — pirate spirit re-cut for the modern wardrobe.\",\n    material: \"100% Baumwolle, Denim\",\n    name: \"Worlds End Denim Boxer Jacket\",\n    originCountry: \"IT\",\n    price: 42000,\n    releaseDate: \"2025-09-15\",\n    returnPeriodDays: 30,\n    status: \"ACTIVE\",\n    updatedAt: \"2026-04-02T10:15:00\",\n    variants: [\n      { color: \"Purple\",    id: 101, size: \"XS\", sku: \"VWW-DBJ-PRP-XS\", stockQuantity: 4,  weightGrams: 720 },\n      { color: \"Purple\",    id: 102, size: \"S\",  sku: \"VWW-DBJ-PRP-S\",  stockQuantity: 12, weightGrams: 740 },\n      { color: \"Purple\",    id: 103, size: \"M\",  sku: \"VWW-DBJ-PRP-M\",  stockQuantity: 0,  weightGrams: 760 },\n      { color: \"Purple\",    id: 104, size: \"L\",  sku: \"VWW-DBJ-PRP-L\",  stockQuantity: 6,  weightGrams: 780 },\n      { color: \"Black\",     id: 105, size: \"S\",  sku: \"VWW-DBJ-BLK-S\",  stockQuantity: 9,  weightGrams: 740 },\n      { color: \"Black\",     id: 106, size: \"M\",  sku: \"VWW-DBJ-BLK-M\",  stockQuantity: 14, weightGrams: 760 },\n      { color: \"Cream\",     id: 107, size: \"M\",  sku: \"VWW-DBJ-CRM-M\",  stockQuantity: 3,  weightGrams: 760 },\n      { color: \"Navy\",      id: 108, size: \"M\",  sku: \"VWW-DBJ-NVY-M\",  stockQuantity: 7,  weightGrams: 760 }\n    ],\n    videos: []\n  };\n\n  /* ============================================================\n     Colour name → hex map (front-end concern, not backend)\n  ============================================================ */\n  const COLOR_HEX = {\n    Black:    \"#0A0A0A\",\n    Purple:   \"#370E4D\",\n    Cream:    \"#E8E5DC\",\n    White:    \"#F5F5F0\",\n    Navy:     \"#1F2845\",\n    Olive:    \"#5A5B36\"\n  };\n\n  /* ============================================================\n     State\n  ============================================================ */\n  let state = {\n    product: PRODUCT_DROP,\n    selectedColor: null,\n    selectedSize:  null\n  };\n\n  /* ============================================================\n     Helpers\n  ============================================================ */\n  const fmtPrice = (cents) =>\n    (cents / 100).toFixed(2).replace('.', ',') + ' €';\n\n  const fmtReleaseDate = (iso) => {\n    if (!iso) return '—';\n    const d = new Date(iso);\n    return d.toLocaleDateString('de-DE', { month: 'short', year: 'numeric' });\n  };\n\n  // Deduplicated colours, in source order\n  const uniqueColors = (variants) => {\n    const seen = new Set(); const out = [];\n    for (const v of variants) {\n      if (!seen.has(v.color)) { seen.add(v.color); out.push(v.color); }\n    }\n    return out;\n  };\n\n  // All sizes across variants (for the size grid)\n  const allSizes = (variants) => {\n    const order = ['XS', 'S', 'M', 'L', 'XL', 'XXL'];\n    const set = new Set(variants.map(v => v.size));\n    return order.filter(s => set.has(s));\n  };\n\n  // Find variant matching (color, size); undefined if none\n  const findVariant = (variants, color, size) =>\n    variants.find(v => v.color === color && v.size === size);\n\n  /* ============================================================\n     Render\n  ============================================================ */\n  function render() {\n    const p = state.product;\n\n    // Header\n    document.getElementById('brandName').textContent = p.brandName.toUpperCase();\n    document.getElementById('crumbBrand').textContent = p.brandName;\n    document.getElementById('crumbName').textContent = p.name;\n    document.getElementById('name').textContent = p.name;\n\n    // Gender badge\n    const gEl = document.getElementById('gender');\n    if (p.gender) { gEl.textContent = p.gender; gEl.classList.remove('hidden'); }\n    else { gEl.classList.add('hidden'); }\n\n    // Collection line — just the collection name now\n    const collEl = document.getElementById('collection');\n    if (p.collectionName) {\n      collEl.textContent = p.collectionName;\n      collEl.classList.remove('hidden');\n    } else {\n      collEl.classList.add('hidden');\n    }\n\n    // Inspiration story — conditional\n    const inspEl = document.getElementById('inspiration');\n    if (p.inspirationStory) {\n      document.getElementById('inspirationBody').textContent = '\"' + p.inspirationStory + '\"';\n      inspEl.classList.remove('hidden');\n    } else {\n      inspEl.classList.add('hidden');\n    }\n\n    // Price\n    document.getElementById('price').textContent = fmtPrice(p.price);\n\n    // Default selection if missing\n    const colors = uniqueColors(p.variants);\n    if (!state.selectedColor || !colors.includes(state.selectedColor)) {\n      state.selectedColor = colors[0] || null;\n    }\n    // Default size = first available for current color\n    const sizesForColor = p.variants.filter(v => v.color === state.selectedColor).map(v => v.size);\n    if (!state.selectedSize || !sizesForColor.includes(state.selectedSize)) {\n      state.selectedSize = sizesForColor[0] || null;\n    }\n\n    // Swatches — show first 3 visible, overflow as \"+N colour(s)\" link\n    const swEl = document.getElementById('swatches');\n    swEl.innerHTML = '';\n    const visibleColors = colors.slice(0, 3);\n    const overflowCount = Math.max(0, colors.length - 3);\n    visibleColors.forEach((c) => {\n      const b = document.createElement('button');\n      b.className = 'swatch' + (c === state.selectedColor ? ' selected' : '');\n      b.style.background = COLOR_HEX[c] || '#999';\n      b.setAttribute('aria-label', c);\n      b.dataset.color = c;\n      b.addEventListener('click', () => { state.selectedColor = c; render(); });\n      swEl.appendChild(b);\n    });\n    // If the currently selected color is hidden behind the overflow,\n    // also surface it inline so the underline indicator is still visible.\n    if (state.selectedColor && !visibleColors.includes(state.selectedColor)) {\n      const c = state.selectedColor;\n      const b = document.createElement('button');\n      b.className = 'swatch selected';\n      b.style.background = COLOR_HEX[c] || '#999';\n      b.setAttribute('aria-label', c);\n      b.addEventListener('click', () => { state.selectedColor = c; render(); });\n      swEl.appendChild(b);\n    }\n    if (overflowCount > 0) {\n      const more = document.createElement('button');\n      more.className = 'swatch-more';\n      more.textContent = `+${overflowCount} colour${overflowCount === 1 ? '' : 's'}`;\n      more.addEventListener('click', () => {\n        // cycle through the hidden colors on each tap (simple demo behaviour)\n        const hidden = colors.slice(3);\n        const idx = hidden.indexOf(state.selectedColor);\n        const next = hidden[(idx + 1) % hidden.length];\n        state.selectedColor = next;\n        render();\n      });\n      swEl.appendChild(more);\n    }\n\n    // Sizes (mark variants without stock or non-existent as disabled)\n    const sizes = allSizes(p.variants);\n    const sizesEl = document.getElementById('sizes');\n    sizesEl.innerHTML = '';\n    sizesEl.style.gridTemplateColumns = `repeat(${Math.max(sizes.length, 1)}, 1fr)`;\n    sizes.forEach((s) => {\n      const v = findVariant(p.variants, state.selectedColor, s);\n      const b = document.createElement('button');\n      const isDisabled = !v || v.stockQuantity === 0;\n      b.className = 'size-btn' + (s === state.selectedSize && !isDisabled ? ' selected' : '') + (isDisabled ? ' disabled' : '');\n      b.textContent = s;\n      if (!isDisabled) {\n        b.addEventListener('click', () => { state.selectedSize = s; render(); });\n      }\n      sizesEl.appendChild(b);\n    });\n\n    // Selected variant + SKU + stock line\n    const selV = findVariant(p.variants, state.selectedColor, state.selectedSize);\n    document.getElementById('colorName').textContent = (state.selectedColor || '—').toUpperCase();\n\n    const skuText = document.getElementById('skuText');\n    const skuBtn = document.getElementById('skuBtn');\n    if (selV) {\n      skuText.textContent = selV.sku;\n      skuBtn.setAttribute('aria-label', `Produktnummer ${selV.sku} kopieren`);\n      skuBtn.disabled = false;\n    } else {\n      skuText.textContent = 'Bitte Größe wählen';\n      skuBtn.disabled = true;\n    }\n\n    const stockEl = document.getElementById('stockLine');\n    if (selV) {\n      if (selV.stockQuantity === 0) {\n        stockEl.textContent = 'Ausverkauft';\n        stockEl.classList.add('low');\n      } else if (selV.stockQuantity <= 5) {\n        stockEl.textContent = `Nur noch ${selV.stockQuantity} verfügbar`;\n        stockEl.classList.add('low');\n      } else {\n        stockEl.textContent = 'Auf Lager';\n        stockEl.classList.remove('low');\n      }\n    } else {\n      stockEl.textContent = '';\n      stockEl.classList.remove('low');\n    }\n\n    // Catalogue tags — fall back to sensible defaults with real colours\n    // when the backend hasn't assigned a catalogueCategory yet, since this\n    // field is rarely null in production.\n    const tagsEl = document.getElementById('tags');\n    tagsEl.innerHTML = '';\n    const categories = (Array.isArray(p.catalogueCategory) && p.catalogueCategory.length)\n      ? p.catalogueCategory\n      : ['Streetwear', 'Culture', 'Star']; // fallback when null\n    categories.forEach((t) => {\n      const el = document.createElement('span');\n      el.className = 'tag ' + t.toLowerCase();\n      el.textContent = t;\n      tagsEl.appendChild(el);\n    });\n    tagsEl.classList.remove('hidden');\n\n    // CTA\n    const cta = document.getElementById('ctaAdd');\n    if (!selV || selV.stockQuantity === 0) {\n      cta.disabled = true;\n      cta.textContent = selV ? 'Ausverkauft' : 'Größe wählen';\n    } else {\n      cta.disabled = false;\n      cta.textContent = 'Zum Warenkorb hinzufügen';\n    }\n\n    // Footer text — return period + origin\n    document.getElementById('returnText').textContent = (p.returnPeriodDays || 30) + ' Tage Rückgaberecht';\n    document.getElementById('originText').textContent = p.originCountry || '—';\n\n    // Gallery tile — shape colour follows selected color (very lightly)\n    const tileShape = document.getElementById('tileShape');\n    tileShape.style.setProperty('--shape-color',\n      state.selectedColor === 'Black' ? '#1A1A1A' :\n      state.selectedColor === 'Purple' ? '#3D1554' :\n      state.selectedColor === 'Cream' ? '#DEDCD5' :\n      '#DEDCD5'\n    );\n    document.getElementById('emptyHint').textContent =\n      (p.images && p.images.length) ? '' : 'images: []  · empty';\n\n    // Accordions\n    renderAccordions(p, selV);\n\n    // Recommendation rows\n    renderRecs();\n\n    // JSON peek\n    renderJsonPeek(p, selV);\n  }\n\n  function renderAccordions(p, selV) {\n    const root = document.getElementById('accordions');\n    root.innerHTML = '';\n\n    const rows = [\n      { open: true, title: 'Produktdetails', body: () => `\n        <p>${p.description || '—'}<\u002Fp>\n        <div class=\"meta\">\n          ${metaRow('Produktnummer (Variante)', selV ? selV.sku : null, true)}\n          ${metaRow('Farbe', state.selectedColor)}\n          ${metaRow('Gewicht', selV ? selV.weightGrams + ' g' : null)}\n          ${metaRow('Material', p.material)}\n          ${metaRow('Geschlecht', p.gender)}\n          ${metaRow('Kollektion', p.collectionName)}\n        <\u002Fdiv>` },\n      { open: false, title: 'Versand & Rückgabe', body: () => `\n        Versand aus ${p.originCountry || '—'}. ${p.returnPeriodDays || 30} Tage Rückgaberecht\n        ab Erhalt der Ware. Versandkostenfrei innerhalb Deutschlands.` },\n      { open: false, title: 'Pflegehinweise', body: () => p.careInstructions\n        ? `<p style=\"font-size:17px;line-height:1.7;color:var(--enunas-black);margin:0 0 12px;\">${p.careInstructions}<\u002Fp>\n           <p style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--enunas-gray-medium);letter-spacing:0.04em;margin:0;\">Hinweise zur richtigen Reinigung und Lagerung sorgen für eine lange Lebensdauer des Produkts.<\u002Fp>`\n        : `<span style=\"color:var(--enunas-gray-medium);font-style:italic;\">Keine Pflegehinweise hinterlegt — <code style=\"font-family:'JetBrains Mono',monospace;font-size:12px;\">careInstructions: null<\u002Fcode><\u002Fspan>` }\n    ];\n\n    rows.forEach((r, i) => {\n      const acc = document.createElement('div');\n      acc.className = 'acc' + (r.open ? ' open' : '');\n      acc.innerHTML = `\n        <button class=\"acc-head\">${r.title}\n          <svg class=\"chev\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 6l5 5 5-5\"/><\u002Fsvg>\n        <\u002Fbutton>\n        <div class=\"acc-body\"><div class=\"acc-body-inner\">${r.body()}<\u002Fdiv><\u002Fdiv>`;\n      acc.querySelector('.acc-head').addEventListener('click', () => acc.classList.toggle('open'));\n      root.appendChild(acc);\n    });\n  }\n\n  function metaRow(k, v, highlight = false) {\n    const isNull = v === null || v === undefined || v === '';\n    const cls = 'meta-row' + (isNull ? ' null' : '');\n    const value = isNull ? 'null' : v;\n    const valueMarkup = highlight && !isNull\n      ? `<span class=\"v\" style=\"background:rgba(55,14,77,0.08);padding:1px 6px;border-radius:2px;\">${value}<\u002Fspan>`\n      : `<span class=\"v\">${value}<\u002Fspan>`;\n    return `<div class=\"${cls}\"><span class=\"k\">${k}<\u002Fspan>${valueMarkup}<\u002Fdiv>`;\n  }\n\n  /* ============================================================\n     JSON peek panel — pretty-print with current variant highlighted\n  ============================================================ */\n  function renderJsonPeek(p, selV) {\n    const target = document.getElementById('jsonPeekBody');\n    const json = JSON.parse(JSON.stringify(p));\n    const text = JSON.stringify(json, null, 2);\n\n    // Simple syntax highlighting\n    let html = text\n      .replace(/&/g, '&amp;').replace(/<\u002Fg, '&lt;').replace(/>/g, '&gt;')\n      .replace(/(\"(\\w+)\")(\\s*:)/g, '<span class=\"k\">$1<\u002Fspan>$3')\n      .replace(/: (\".*?\")/g, ': <span class=\"s\">$1<\u002Fspan>')\n      .replace(/: (-?\\d+\\.?\\d*)/g, ': <span class=\"n\">$1<\u002Fspan>')\n      .replace(/: (null)/g, ': <span class=\"nul\">$1<\u002Fspan>');\n\n    // Highlight the currently selected variant by SKU\n    if (selV) {\n      html = html.replace(new RegExp(`(\"${selV.sku}\")`, 'g'), '<span class=\"highlight\">$1<\u002Fspan>');\n    }\n\n    target.innerHTML = html;\n  }\n\n  /* ============================================================\n     Recommendation rows\n  ============================================================ */\n  const SILHOUETTES = {\n    // Editorial outfit figure for \"Vervollständige den Look\" hero\n    figure: `\n      <svg viewBox=\"0 0 120 200\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMax meet\">\n        <!-- Hair / head -->\n        <path d=\"M48 4 Q60 0 72 4 Q80 8 80 18 Q80 28 76 32 L72 34 L48 34 L44 32 Q40 28 40 18 Q40 8 48 4 Z\" fill=\"#2D2316\"/>\n        <ellipse cx=\"60\" cy=\"22\" rx=\"11\" ry=\"13\" fill=\"#D4BBA1\"/>\n        <path d=\"M50 14 Q60 6 70 14 Q72 18 72 22 L66 24 L66 18 L54 18 L54 24 L48 22 Q48 18 50 14 Z\" fill=\"#2D2316\"/>\n        <!-- Neck -->\n        <rect x=\"55\" y=\"33\" width=\"10\" height=\"7\" fill=\"#C4A88A\"/>\n        <!-- Shirt (oversized) -->\n        <path d=\"M28 46 Q40 38 50 38 L52 40 L56 42 Q60 44 64 42 L68 40 L70 38 Q80 38 92 46 L88 56 L88 102 L32 102 L32 56 Z\" fill=\"#EDE9DD\"/>\n        <!-- Collar accent -->\n        <path d=\"M50 38 L60 50 L70 38 L66 36 L60 38 L54 36 Z\" fill=\"#A3BCD8\"/>\n        <!-- Sleeves -->\n        <path d=\"M28 46 L18 78 L26 84 L34 56 Z\" fill=\"#EDE9DD\"/>\n        <path d=\"M92 46 L102 78 L94 84 L86 56 Z\" fill=\"#EDE9DD\"/>\n        <!-- Pants (wide / cropped) -->\n        <path d=\"M32 102 L88 102 L86 168 L66 168 L62 124 L58 124 L54 168 L34 168 Z\" fill=\"#9B7B58\"/>\n        <!-- Belt detail -->\n        <rect x=\"32\" y=\"100\" width=\"56\" height=\"4\" fill=\"#3D3024\" opacity=\"0.5\"/>\n        <!-- Shoes -->\n        <ellipse cx=\"42\" cy=\"170\" rx=\"14\" ry=\"5\" fill=\"#3D2418\"/>\n        <ellipse cx=\"78\" cy=\"170\" rx=\"14\" ry=\"5\" fill=\"#3D2418\"/>\n      <\u002Fsvg>`,\n    // Per-category item silhouettes (tinted with item.tone via currentColor)\n    top: `\n      <svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n        <path d=\"M22 30 L34 18 L42 20 L46 26 L54 26 L58 20 L66 18 L78 30 L74 40 L74 82 L26 82 L26 40 Z\" fill=\"currentColor\"/>\n        <path d=\"M46 20 L50 32 L54 20 L52 18 L50 20 L48 18 Z\" fill=\"rgba(255,255,255,0.25)\"/>\n      <\u002Fsvg>`,\n    bottom: `\n      <svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n        <path d=\"M28 14 L72 14 L74 30 L72 84 L58 84 L52 50 L48 50 L42 84 L28 84 L26 30 Z\" fill=\"currentColor\"/>\n        <line x1=\"50\" y1=\"14\" x2=\"50\" y2=\"50\" stroke=\"rgba(255,255,255,0.18)\" stroke-width=\"1\"/>\n      <\u002Fsvg>`,\n    shoe: `\n      <svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n        <path d=\"M30 28 L52 26 L54 58 L74 62 L80 68 L80 76 L74 80 L24 80 L18 75 L20 64 L30 60 Z\" fill=\"currentColor\"/>\n        <path d=\"M52 30 L52 56 L58 58\" stroke=\"rgba(255,255,255,0.18)\" stroke-width=\"1\" fill=\"none\"/>\n      <\u002Fsvg>`,\n    accessory: `\n      <svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n        <rect x=\"12\" y=\"46\" width=\"76\" height=\"8\" fill=\"currentColor\"/>\n        <rect x=\"44\" y=\"42\" width=\"12\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"/>\n        <rect x=\"48\" y=\"46\" width=\"4\" height=\"8\" fill=\"currentColor\"/>\n        <circle cx=\"22\" cy=\"50\" r=\"1.5\" fill=\"rgba(255,255,255,0.25)\"/>\n        <circle cx=\"78\" cy=\"50\" r=\"1.5\" fill=\"rgba(255,255,255,0.25)\"/>\n      <\u002Fsvg>`,\n    jacket: `\n      <svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n        <path d=\"M20 28 L34 18 L46 22 L50 20 L54 22 L66 18 L80 28 L76 38 L76 86 L24 86 L24 38 Z\" fill=\"currentColor\"/>\n        <line x1=\"50\" y1=\"20\" x2=\"50\" y2=\"86\" stroke=\"rgba(255,255,255,0.25)\" stroke-width=\"1\"/>\n        <circle cx=\"50\" cy=\"38\" r=\"1.2\" fill=\"rgba(255,255,255,0.35)\"/>\n        <circle cx=\"50\" cy=\"52\" r=\"1.2\" fill=\"rgba(255,255,255,0.35)\"/>\n        <circle cx=\"50\" cy=\"66\" r=\"1.2\" fill=\"rgba(255,255,255,0.35)\"/>\n      <\u002Fsvg>`,\n    bag: `\n      <svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n        <path d=\"M36 38 Q36 24 50 24 Q64 24 64 38\" stroke=\"currentColor\" stroke-width=\"2.5\" fill=\"none\"/>\n        <rect x=\"22\" y=\"38\" width=\"56\" height=\"44\" fill=\"currentColor\"/>\n        <line x1=\"22\" y1=\"48\" x2=\"78\" y2=\"48\" stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"0.8\"/>\n      <\u002Fsvg>`\n  };\n\n  const REC_DATA = {\n    look: [\n      { brand: 'Halden',       name: 'Leather Derby Boot',  price: '€ 940',   tone: '#3a2317', kind: 'shoe',      colors: ['#3a2317', '#0A0A0A'] },\n      { brand: 'Studio Rück',  name: 'Heavy Knit Sweater',  price: '€ 740',   tone: '#8b7355', kind: 'top',       colors: ['#8b7355', '#E8E5DC', '#0A0A0A'] },\n      { brand: 'Côte Sauvage', name: 'Wide-leg Trousers',   price: '€ 520',   tone: '#1F2845', kind: 'bottom',    colors: ['#1F2845', '#3D3024'] },\n      { brand: 'Maison Vela',  name: 'Leather Belt',        price: '€ 320',   tone: '#1a1a1a', kind: 'accessory', colors: ['#1a1a1a', '#3a2317'] }\n    ],\n    similar: [\n      { brand: 'Côte Sauvage', name: 'Cropped Bomber',           price: '€ 1.120', tone: '#1F2845', kind: 'jacket', colors: ['#0011A5', '#0A0A0A'] },\n      { brand: 'Khōri',        name: 'Embroidered Field Jacket', price: '€ 1.640', tone: '#5A5B36', kind: 'jacket', colors: ['#5A5B36', '#0A0A0A'] },\n      { brand: 'Atelier Noir', name: 'Asymmetric Layered Coat',  price: '€ 2.340', tone: '#0A0A0A', kind: 'jacket', colors: ['#0A0A0A', '#3a3a3a'] },\n      { brand: 'Maison Vela',  name: 'Tailored Wool Trench',     price: '€ 1.890', tone: '#3d2a1d', kind: 'jacket', colors: ['#3d2a1d', '#8b7355', '#0A0A0A'] }\n    ]\n  };\n\n  const BRAND_ITEMS = {\n    StreetLabel2: [\n      { name: 'Box Logo Crewneck',       price: '€ 95',  tone: '#0A0A0A', kind: 'top',     colors: ['#0A0A0A', '#E8E5DC'] },\n      { name: 'Drop Sweatpants Vol.1',   price: '€ 120', tone: '#2D2D2D', kind: 'bottom',  colors: ['#2D2D2D', '#8b7355'] },\n      { name: 'Reversible Bomber',       price: '€ 420', tone: '#1F2845', kind: 'jacket',  colors: ['#1F2845', '#0A0A0A'] },\n      { name: 'Wide-fit Carpenter Pant', price: '€ 180', tone: '#8b7355', kind: 'bottom',  colors: ['#8b7355', '#2D2D2D'] }\n    ],\n    'Vivienne Westwood': [\n      { name: 'Orb Logo Tee',          price: '€ 210',   tone: '#3D3024', kind: 'top',    colors: ['#E8E5DC', '#0A0A0A', '#370E4D'] },\n      { name: 'Pirate Boot',           price: '€ 780',   tone: '#3a2317', kind: 'shoe',   colors: ['#3a2317', '#0A0A0A'] },\n      { name: 'Tartan Pleated Skirt',  price: '€ 590',   tone: '#6A0F1B', kind: 'bottom', colors: ['#6A0F1B', '#1F2845'] },\n      { name: 'Yasmine Saddle Bag',    price: '€ 1.140', tone: '#0A0A0A', kind: 'bag',    colors: ['#0A0A0A', '#3a2317'] }\n    ]\n  };\n\n  function renderRecs() {\n    const p = state.product;\n\n    const itemCard = (item, klass = 'rec-card') => {\n      const swatchesHtml = (item.colors || []).slice(0, 4).map((c) =>\n        `<span class=\"rec-swatch\" style=\"background:${c}\"><\u002Fspan>`\n      ).join('');\n      return `\n      <article class=\"${klass}\">\n        <div class=\"rec-image\">\n          <div class=\"item-silhouette\" style=\"color:${item.tone}\">${SILHOUETTES[item.kind] || SILHOUETTES.top}<\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"rec-brand\">${item.brand.toUpperCase()}<\u002Fp>\n        <h3 class=\"rec-name\">${item.name}<\u002Fh3>\n        ${swatchesHtml ? `<div class=\"rec-colors\">${swatchesHtml}<\u002Fdiv>` : ''}\n        <p class=\"rec-price\">${item.price}<\u002Fp>\n      <\u002Farticle>`;\n    };\n\n    // ── Vervollständige den Look — hero + adaptive 1/2/4 mini cards ──\n    const lookGrid = document.querySelector('#recLook .row-grid');\n    const lookCount = Math.min(REC_DATA.look.length, (TWEAKS && TWEAKS.lookCount) || 4);\n    const items = REC_DATA.look.slice(0, lookCount);\n    const heroHtml = `\n      <div class=\"look-hero\">\n        <span class=\"rec-label\">Outfit · ${lookCount} Stücke<\u002Fspan>\n        <div class=\"look-hero-figure\">${SILHOUETTES.figure}<\u002Fdiv>\n      <\u002Fdiv>`;\n    const miniCards = items.map((it) => itemCard(it, 'look-card')).join('');\n    lookGrid.innerHTML = heroHtml + `<div class=\"look-grid\" data-count=\"${lookCount}\">${miniCards}<\u002Fdiv>`;\n\n    // ── Mehr von der Marke — dynamic brand name + 4 items ───────\n    document.getElementById('recBrandName').textContent = p.brandName;\n    const brandItems = (BRAND_ITEMS[p.brandName] || BRAND_ITEMS.StreetLabel2)\n      .map((it) => ({ ...it, brand: p.brandName }));\n    document.querySelector('#recBrand .row-grid').innerHTML =\n      brandItems.map((it) => itemCard(it)).join('');\n\n    // ── Ähnliche Produkte ───────────────────────────────────────\n    document.querySelector('#recSimilar .row-grid').innerHTML =\n      REC_DATA.similar.map((it) => itemCard(it)).join('');\n  }\n\n  /* ============================================================\n     SKU copy\n  ============================================================ */\n  const skuBtn = document.getElementById('skuBtn');\n  async function copySku() {\n    if (skuBtn.disabled) return;\n    const sku = document.getElementById('skuText').textContent.trim();\n    try { await navigator.clipboard.writeText(sku); }\n    catch {\n      const ta = document.createElement('textarea');\n      ta.value = sku; ta.style.position = 'fixed'; ta.style.opacity = '0';\n      document.body.appendChild(ta); ta.select();\n      try { document.execCommand('copy'); } catch {}\n      document.body.removeChild(ta);\n    }\n    skuBtn.classList.add('copied');\n    clearTimeout(skuBtn._t);\n    skuBtn._t = setTimeout(() => skuBtn.classList.remove('copied'), 1600);\n  }\n  skuBtn.addEventListener('click', copySku);\n\n  /* ============================================================\n     Toolbar\n  ============================================================ */\n  document.getElementById('prod1').addEventListener('click', () => {\n    document.getElementById('prod1').classList.add('active');\n    document.getElementById('prod2').classList.remove('active');\n    state = { product: PRODUCT_DROP, selectedColor: null, selectedSize: null };\n    render();\n  });\n  document.getElementById('prod2').addEventListener('click', () => {\n    document.getElementById('prod2').classList.add('active');\n    document.getElementById('prod1').classList.remove('active');\n    state = { product: PRODUCT_VIVIENNE, selectedColor: null, selectedSize: null };\n    render();\n  });\n\n  const toggleNotes = document.getElementById('toggleNotes');\n  toggleNotes.addEventListener('click', () => {\n    const next = !document.body.classList.contains('show-notes');\n    setTweak({ showChangeOutline: next });\n  });\n\n  const togglePeek = document.getElementById('togglePeek');\n  togglePeek.addEventListener('click', () => {\n    const p = document.getElementById('jsonPeek');\n    p.classList.toggle('open');\n    togglePeek.classList.toggle('active');\n    togglePeek.textContent = p.classList.contains('open') ? 'Hide JSON' : 'View JSON';\n  });\n\n  /* ============================================================\n     Init\n  ============================================================ */\n  document.body.classList.add('show-notes');\n  toggleNotes.classList.add('active');\n  toggleNotes.textContent = 'Hide change';\n  render();<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
